[build]
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# The page runs on HighLevel's domain and loads these logos from here. The PDF capture
# (html2canvas) can only draw cross-origin images if they are served with CORS headers.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
